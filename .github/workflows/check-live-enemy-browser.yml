name: Live Blender enemy rigs in Chromium WebGL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-live-enemy-browser.yml
      - beta/dungeon-enemy-rig.js
      - beta/dungeon-guardian-rig.js
      - beta/dungeon-guardian.js
      - beta/dungeon-isometric.js
      - beta/creature-fur.js
      - beta/index.html
      - beta/art/skeleton/skeleton-*-rig.glb.gz
      - beta/art/skeleton/skeleton-live.json
      - beta/art/skeleton/skeleton-atlas.json
      - beta/art/skeleton/atlas-*.webp
      - beta/art/rat/rat-live-rig.glb.gz
      - beta/art/rat/rat-live.json
      - tools/check-live-enemy-browser.cjs
  workflow_run:
    workflows: [Fast export Guardian-style skeleton and rat rigs]
    types: [completed]

permissions:
  contents: read

jobs:
  webgl:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium WebGL test tools
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Run real 3D enemy rendering in the browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mind-dungeon-server.log 2>&1 &
          webserver=$!
          trap 'kill $webserver || true' EXIT
          node tools/check-live-enemy-browser.cjs
      - name: Upload Guardian versus skeleton and rat art comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-forged-art-audit
          path: artifacts/*.png
          if-no-files-found: ignore

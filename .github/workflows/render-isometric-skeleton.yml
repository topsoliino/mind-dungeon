name: Render 360-degree Blender skeleton animations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-isometric-skeleton.yml
      - tools/build-isometric-skeleton.py
      - tools/check-isometric-skeleton-atlases.py

permissions:
  contents: write

concurrency:
  group: isometric-skeleton-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and Python assets checker
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender -b --version | head -2
      - name: Rebuild original rig and all 32-view animations
        run: |
          blender -b --factory-startup -t 4 --python-exit-code 1 \
            -P tools/build-isometric-skeleton.py
      - name: Verify generated Blender assets
        env:
          MIND_DUNGEON_REQUIRE_CURRENT_ATLAS: "1"
        run: |
          python3 -m venv /tmp/skeleton-qa
          /tmp/skeleton-qa/bin/python -m pip install --disable-pip-version-check Pillow
          /tmp/skeleton-qa/bin/python tools/check-isometric-skeleton-atlases.py
      - name: Commit all 32-way animated WebP atlases (canonical Blender sources come from fast rig build)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/art/skeleton/*.webp
          # Avoid dirty binary sources during rebase; fast rig CI owns .blend.
          git restore -- beta/art/skeleton/skeleton.blend
          if ! git diff --cached --quiet; then
            git commit -m "Blender: publish 32 facing skeleton fallback atlases"
            # Other active workflows may commit during a 32-view Blender
            # bake. Retry ordinary fast-forward pushes instead of losing art.
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Skeleton assets committed on attempt $attempt"
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish skeleton render after retries" >&2
            exit 1
          else
            echo "Skeleton art unchanged."
          fi

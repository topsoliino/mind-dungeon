name: Render Blender small rat and 32-way sprite animations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-isometric-rat.yml
      - tools/build-isometric-rat.py
      - tools/creature_fur.py
      - tools/check-isometric-rat-atlases.py

permissions:
  contents: write

concurrency:
  group: isometric-rat-render
  cancel-in-progress: false

jobs:
  render-rat:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify sprite selector and Python source
        run: |
          node tools/check-isometric-rat-sprites.cjs
          python3 -m py_compile tools/build-isometric-rat.py tools/creature_fur.py
      - name: Install Blender and atlas inspector
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-pil
          blender -b --version | head -2
      - name: Build editable rat armature and bake all directional poses
        run: |
          blender -b --factory-startup -t 4 --python-exit-code 1 \
            -P tools/build-isometric-rat.py
      - name: Inspect actual Blender source and rendered WebP sheets
        run: python3 tools/check-isometric-rat-atlases.py
      - name: Publish ONLY current 32-direction rat fallback atlases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          build_base=$(git rev-parse HEAD)
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          cp beta/art/rat/*.webp "$temp_dir/"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git diff --quiet "$build_base" origin/main -- tools/build-isometric-rat.py tools/creature_fur.py; then
              echo "Newer rat sculpt detected; discarding obsolete atlases."
              exit 0
            fi
            # Preserve newer source and the canonical Blender rig even if a
            # second job published it during this expensive atlas bake.
            git reset --hard origin/main
            cp "$temp_dir/"*.webp beta/art/rat/
            git add beta/art/rat/*.webp
            if git diff --cached --quiet; then
              echo "Rat atlases already current."
              exit 0
            fi
            git commit -m "Blender: publish Guardian-rat 32-direction atlases"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Unable to publish rat fallback atlases."
          exit 1

name: Render Blender small rat and 32-way sprite animations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-isometric-rat.yml
      - tools/build-isometric-rat.py
      - tools/guardian-style.py
      - tools/check-isometric-rat-atlases.py

permissions:
  contents: write

concurrency:
  group: isometric-rat-render
  cancel-in-progress: false

jobs:
  render-rat:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify sprite selector and Python source
        run: |
          node tools/check-isometric-rat-sprites.cjs
          python3 -m py_compile tools/build-isometric-rat.py
      - name: Install Blender and atlas inspector
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-pil
          blender -b --version | head -2
      - name: Build editable rat armature and bake all directional poses
        run: |
          blender -b --factory-startup -t 4 --python-exit-code 1 \
            -P tools/build-isometric-rat.py
      - name: Inspect actual Blender source and rendered WebP sheets
        run: python3 tools/check-isometric-rat-atlases.py
      - name: Commit rendered fallback atlases (canonical Blender source comes from fast rig build)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/art/rat/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Blender: publish 32 facing rat fallback atlases"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Rat geometry and atlases unchanged."
          fi

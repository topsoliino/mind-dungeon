name: Skeleton combat and live Blender-rig regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-isometric-skeleton.yml
      - beta/alley-skeleton.js
      - beta/skeleton-combat.js
      - beta/soul-vessels.js
      - beta/ghost-fog-visual.js
      - beta/dungeon-enemy-sim.js
      - beta/dungeon-enemies.js
      - beta/art/skeleton/**
      - tools/build-isometric-skeleton.py
      - tools/check-isometric-skeleton.cjs
      - tools/check-skeleton-specials.cjs
      - tools/check-isometric-skeleton-sprites.cjs

permissions:
  contents: read

jobs:
  skeleton-regressions:
    name: Skeleton combat and 3D-only model validation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify six-hit combo, double-arrow fire, cartwheel, collision and ten-second poison cloud
        run: node tools/check-isometric-skeleton.cjs
      - name: Verify skeleton 3D-only clip selection, cartwheels and deterministic dungeon spawns
        run: node tools/check-isometric-skeleton-sprites.cjs

name: Fast export Guardian-style skeleton and rat rigs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-guardian-enemy-rigs.yml
      - tools/build-isometric-skeleton.py
      - tools/build-isometric-rat.py
      - tools/creature_fur.py
      - tools/export-enemy-rigs.py
      - tools/check-live-enemy-rigs.py

permissions:
  contents: write

concurrency:
  group: guardian-style-fast-rigs
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate both Guardian-derived builders before starting Blender
        run: |
          python3 -m py_compile tools/build-isometric-skeleton.py tools/build-isometric-rat.py tools/creature_fur.py tools/export-enemy-rigs.py tools/check-live-enemy-rigs.py
          node tools/check-live-enemy-renderer.cjs
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Build actual sculpted skeleton and rat rigs without atlas batching
        env:
          MIND_DUNGEON_RIG_ONLY: "1"
        run: |
          blender -b --factory-startup -t 4 --python-exit-code 1 -P tools/build-isometric-skeleton.py
          blender -b --factory-startup -t 4 --python-exit-code 1 -P tools/build-isometric-rat.py
      - name: Export and verify all three full skinned GLBs
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 4 --python-exit-code 1 -P tools/export-enemy-rigs.py
          python3 tools/check-live-enemy-rigs.py
      - name: Publish ONLY current Blender sources and live GLBs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          build_base=$(git rev-parse HEAD)
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          mkdir -p "$temp_dir/skeleton" "$temp_dir/rat"
          cp beta/art/skeleton/skeleton.blend beta/art/skeleton/skeleton-*-rig.glb.gz beta/art/skeleton/skeleton-live.json "$temp_dir/skeleton/"
          cp beta/art/rat/rat.blend beta/art/rat/rat-live-rig.glb.gz beta/art/rat/rat-live.json "$temp_dir/rat/"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            # Never let an older long-running Blender job overwrite a newer
            # script/rig. Bot-generated binaries may race, but their source
            # definitions must not have advanced since this job started.
            if ! git diff --quiet "$build_base" origin/main -- \
              tools/build-isometric-skeleton.py tools/build-isometric-rat.py \
              tools/creature_fur.py tools/export-enemy-rigs.py; then
              echo "Newer Blender source detected; discarding stale render."
              exit 0
            fi
            # Binary .blend/.gz files cannot be rebased. Reset to the latest
            # branch BEFORE overlaying only generated assets. Never stage or
            # overwrite any source code belonging to newer commits.
            git reset --hard origin/main
            cp "$temp_dir/skeleton/"* beta/art/skeleton/
            cp "$temp_dir/rat/"* beta/art/rat/
            git add beta/art/skeleton/skeleton.blend beta/art/skeleton/skeleton-*-rig.glb.gz beta/art/skeleton/skeleton-live.json
            git add beta/art/rat/rat.blend beta/art/rat/rat-live-rig.glb.gz beta/art/rat/rat-live.json
            if git diff --cached --quiet; then
              echo "Assets already match current source."
              exit 0
            fi
            git commit -m "Blender: publish Guardian-derived live enemy rigs"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Failed to publish current 3D renders without racing."
          exit 1

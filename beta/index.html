function levelMenu(selected){
 if(!save.pendingLevels)return;
 show('<section class="level-ritual"><header class="ritual-header"><h2 class="md-title">Stufe '+save.level+'</h2><p>'+save.pendingLevels+' freie Attributpunkte</p></header>'+
  statusRows(attributeStats(save.attributes),true)+'<div class="actions"><button id="later">Später</button></div></section>','level');
 document.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>{
  if(!save.pendingLevels)return;
  const key=b.dataset.stat;
  if(authorityMode){serverAction('level',{attribute:key}).then(ok=>{if(!ok)return;if(save.pendingLevels)levelMenu(key);else close();});return;}
  save.attributes[key]++;save.pendingLevels--;player.max=maxHP();soundUI('learn_stat');
  player.hp=Math.min(player.max,player.hp+(key==='vigor'?3:0));
  player.stamina=Math.min(player.stamina,maxStamina());persist();
  if(save.pendingLevels)levelMenu(key);else close();
 });
 if(typeof selected==='string')document.querySelector('[data-stat="'+selected+'"]')?.focus();
 mdButton('later',close);
}
async function refreshCatalog(){
 try{
  const cfg=MD_PUBLIC_CONFIG;
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(cfg.url))throw Error('Supabase-URL ungültig');
  const response=await fetch(cfg.url+'/rest/v1/item_catalog?select=*&enabled=eq.true',{headers:{apikey:cfg.publishableKey},signal:AbortSignal.timeout(3500)});
  if(!response.ok)throw Error('Supabase-Katalog nicht bereit: '+response.status);
  const rows=await response.json();
  const weapons=rows.filter(x=>x.kind==='weapon').map(x=>({id:x.id,name:x.name_de,desc:x.description_de,base:x.base_damage,reach:x.reach,speed:Number(x.attack_seconds),stamina:x.stamina_cost,scale:x.scaling||{}}));
  const rings=rows.filter(x=>x.kind==='ring').map(x=>({id:x.id,name:x.name_de,desc:x.description_de,bonus:x.effect?.bonus}));
  if(!weapons.some(w=>w.id==='rust')||!rings.length)throw Error('Grundkatalog unvollständig');
  WEAPONS=weapons.some(w=>w.id==='bow')?weapons:[...weapons,simpleBow];RINGS=rings;window.__mindCatalogSource='Supabase';
 }catch(err){
  console.warn('Supabase noch nicht verfügbar, lade lokalen Katalog:',err.message);
  try{const response=await fetch('catalog/items.json',{cache:'no-cache'});if(!response.ok)throw Error('Lokaler Katalog nicht erreichbar');const catalog=await response.json();if(!Array.isArray(catalog.weapons)||!Array.isArray(catalog.rings)||!catalog.weapons.length)throw Error('Ungültiger Katalog');WEAPONS=catalog.weapons.some(w=>w.id==='bow')?catalog.weapons:[...catalog.weapons,simpleBow];RINGS=catalog.rings;window.__mindCatalogSource='catalog/items.json'}catch(e){console.warn('Ersatzkatalog aktiv:',e.message);window.__mindCatalogSource='eingebauter Ersatzkatalog'}
 }
}

function iconImage(type,id,color){return '<img src="'+art.url(type,id,color)+'" width="64" height="64" alt="">';}
function itemIcon(item){
 if(item.kind==='key')return iconImage('dungeon-key-item');
 if(item.kind==='bossNote')return iconImage('note-item');
 if(item.kind==='trialCharm')return iconImage('trial-charm-item');
 if(item.kind==='bones')return iconImage('currency-item','bones');
 if(item.kind==='cup')return iconImage('cup-item',item.id);
 if(item.kind==='potion')return iconImage('potion-item','',brewing.mix(item.brew));
 if(item.kind==='food')return iconImage('food-item',item.id);
 if(item.kind==='armor')return iconImage('armor-item',item.id);
 if(item.kind==='ring')return iconImage('ring',item.id);
 return iconImage('weapon-item',weaponArtId(item.id));
}
function itemTitle(item){if(item.kind==='key')return 'Schlüssel · '+world.keyName(item.id);
 if(item.kind==='bossNote')return 'Notiz über den Boss';
 if(item.kind==='trialCharm')return 'Prüfsiegel der Kanalisation';
 if(item.kind==='bones')return item.bundle===3?'3 Knochen':'Knochen';
 if(item.kind==='cup')return item.id===brewing.goldenCup.id?'Goldener Becher':item.bundle?'3 leere Becher':'Leerer Becher';
 if(item.kind==='potion')return 'Sud · '+brewing.entries(item.brew).map(e=>brewing.effects[e.id].label).join(' / ');
 if(item.kind==='food')return items.food[item.id]?.name||'Nahrung';return item.kind==='armor'?(armorById(item.id)?.name||'Rüstung'):item.kind==='weapon'?weaponById(item.id).name:ringById(item.id)?.name||'Unbekannter Ring'}
function ringEffectText(id){
 const effects={hunter:'Schnelle Waffen verursachen 18 % mehr Schaden.',
  scholar:'Waffen mit Intelligenz-Skalierung verursachen 22 % mehr Schaden.',
  bulwark:'12 % weniger eingehender Schaden.',dodge:'Ausweichen kostet 17 statt 25 Ausdauer.',
  faith:'Heilt 3 LP pro Treffer.',luck:'Erhöht den Erlös beim Händler von 40 % auf 55 % des Grundwerts.',
  merchant:items.merchantRing.desc};
 return effects[id]||ringById(id)?.desc||'';
}
function statToken(type,text,label=items.damage[type].label){
 const d=items.damage[type];return '<span class="stat-token" style="--type:'+d.color+'" title="'+qEsc(label)+'">'+d.icon+' '+qEsc(text)+'<span class="visually-hidden"> '+qEsc(label)+'</span></span>';
}
function damageStars(profile){
 const groups=Object.entries(profile.stars);
 const description=groups.map(([type,n])=>items.damage[type].label+' '+(n*20)+' %').join(' · ');
 const tokens=groups.map(([type,n])=>{
  const info=items.damage[type],extra=profile.extraStars[type]||0;
  return '<span class="damage-star-group" style="--type:'+info.color+'" title="'+qEsc(info.label+' · '+n*20+' %')+'">'+
   '<span class="damage-type-label">'+qEsc(info.label)+'</span><span class="damage-star-pips">'+
   Array.from({length:n},(_,i)=>'<i class="damage-star'+(i>=n-extra?' extra':'')+'">'+info.icon+'</i>').join('')+'</span></span>';
 }).join('');
 return '<span class="weapon-stars" role="img" aria-label="'+qEsc(description)+'">'+tokens+'</span>';
}
function itemDetails(it,concealNote=false){
 if(!it)return '<p class="muted">Wähle einen Gegenstand.</p>';
 const rank=items.rank(it),rarity=items.rarity[rank],mythic=rank==='mythic';
 const header='<div class="item-detail-title">'+itemTile(it)+'<div><h3>'+qEsc(itemTitle(it))+'</h3><small style="color:'+rarity.color+'">'+rarity.label+' · '+qEsc(it.source||'Ausrüstung')+'</small></div></div>';
 if(it.kind==='key')return header+'<p>Wird am passenden Schloss verbraucht.</p>';
 if(it.kind==='cup')return header+(it.id===brewing.goldenCup.id?'<p>Fasst alle sechs Zutaten der Brauerei und verdoppelt die Wirkungsdauer.</p>':'<p>Wird in der Brauerei beim Abfüllen verbraucht.</p>');
 if(it.kind==='potion')return header+'<p>'+Math.ceil(it.duration)+' s nach dem Trinken</p>'+brewing.entries(it.brew).map(effect=>
  '<p style="color:'+items.rarity[effect.rank].color+'">'+qEsc(brewEffectLabel(effect))+'</p>').join('');
 if(it.kind==='trialCharm')return header+'<p>Verwandelt alle noch ungeöffneten Truhen im Lauf in Prüftruhen. Jede bestandene Prüfung gibt mindestens seltene Beute.</p>';
 if(it.kind==='bossNote')return header+(concealNote?'<p>Deckname des Bosses</p>':'<p>'+bossRules.name+'</p>');
 if(it.kind==='food')return header+'<p>Heilt bis zu '+(items.food[it.id]?.heal||0)+' Lebenspunkte.</p>';
 if(it.kind==='weapon'){
  const w=weaponById(it.id),profile=items.weapon(w.id,rank),enchant=items.enchantment(it);
  const {base,bonus,scaling}=damageBreakdown(w,rank);
  const grades=scaling.map(entry=>'<span class="scale-grade" title="'+scalingRule(entry)+' · +'+entry.bonus+' aktuell">'+
   attributeIcons[entry.attribute]+' '+qEsc(attributeName(entry.attribute))+' <b>'+entry.grade+'</b></span>').join('');
  const types=enchant?Object.entries(items.attackSplit(profile.split,enchant)).map(([type,share])=>statToken(type,pct(share))).join(''):damageStars(profile);
  const status=profile.status?statToken(profile.status,items.damage[profile.status].label):'';
  return header+(enchant?'<p class="forge-enchantment">'+qEsc(items.damage[enchant].label)+' · 25 % des physischen Schadens umgewandelt</p>':'')+'<div class="weapon-totals"><span class="damage-stat"><b>'+base+'</b><small>Grundschaden</small></span>'+
   '<span class="damage-stat bonus"><b>+'+bonus+'</b><small>Attributsbonus</small></span><div class="item-stats" aria-label="Schadensarten">'+types+status+'</div></div>'+
   '<div class="scaling-list">'+grades+'</div><p>Knockback '+items.knockbackPower(w,save.attributes)+' · '+kgText(profile.kg)+' · Waffen-Crit +'+pct(profile.crit)+(profile.critFactor>2?' · Crit ×'+profile.critFactor.toLocaleString('de-DE'):'')+'</p>'+
   (mythic?'<p class="item-malus">Mythisch · +20 % Dash-Abklingzeit</p>':'')+weaponRequirements(it.id);
 }
 if(it.kind==='armor'){
  const piece=armorById(it.id);
  if(!piece)return header;
  const mods=items.affinity(piece,rank),effect=items.armorEffectText(it.id);
  const key=items.armorProfile(it.id)?.effect?.key;
  const seconds=(key==='block'||key==='heal')&&isEquipped(it)?Math.ceil(items.armorCooldown(save,key)):null;
  return header+'<p>'+qEsc(ARMOR_PARTS[piece.slot])+' · '+kgText(piece.kg)+'</p>'+
   '<div class="item-stats">'+Object.entries(mods).map(([type,v])=>statToken(type,(v>0?'+':'')+pct(v),items.damage[type].label+(v>0?' · Resistenz':' · Anfälligkeit'))).join('')+'</div>'+
   (effect?'<p>'+qEsc(effect)+'</p>':'')+
   (seconds===null?'':'<p>'+(seconds?'Wieder bereit in '+seconds+' s':'Effekt bereit')+'</p>')+
   (mythic?'<p class="item-malus">Mythisch · −3 % Lauftempo</p>':'');
 }
 const mythicText=mythic?'<p class="item-malus">Mythisch · +20 % Waffenschaden, +12 % erlittener Dunkelschaden</p>':'';
 return header+'<p>'+qEsc(ringEffectText(it.id))+'</p>'+mythicText;
}
function weaponRequirements(id){
 const requirements=Object.entries(items.requirements[id]||{});
 if(!requirements.length)return '';
 return '<p class="item-requirements">Voraussetzung: '+requirements.map(([stat,value])=>{
  const label=attributeName(stat);
  return '<span class="'+(save.attributes[stat]<value?'item-malus':'')+'">'+qEsc(label)+' '+value+'</span>';
 }).join(' · ')+'</p>';

function slotItem(index){return save.inventory.find(it=>items.key(it)===save.quickSlots[index]);}
function cycleQuickSlot(direction){
 save.quickActive=(save.quickActive+direction+save.quickSlots.length)%save.quickSlots.length;
 soundUI('ui_select');updateQuickBar();persist();
}
function useQuickSlot(){
 const it=slotItem(save.quickActive);
 if(!it){soundUI('ui_error');tell('Schnellplatz '+(save.quickActive+1)+' ist leer');return;}
 if(it.kind==='bossNote'){tell(bossRules.name);return;}
 if(it.kind==='trialCharm'){useTrialCharm(it);return;}
 if(it.kind==='potion'){usePotion(it);return;}
 if(it.kind==='food'){if(!eatFood(it))tell('Lebenspunkte bereits voll oder durch vorgemerkte Nahrung abgedeckt');return;}
 if(isEquipped(it)){tell('Bereits ausgerüstet · '+itemTitle(it));return;}
 equipInventoryItem(it);
}
function quickSelect(it){
 if(!it||!save.inventory.includes(it))return;
 save.quickSlots=expedition.firstSlot(save.quickSlots,items.key(it));
 save.quickActive=0;
 soundUI('ui_confirm');
 persist();
 tell(itemTitle(it)+' · Auf Schnellplatz 1');
}
let quickBarSignature='';
function updateQuickBar(){
 const bar=$('#quickBar'),entries=save.quickSlots.map((_,i)=>slotItem(i));
 bar.hidden=paused;
 const signature=save.quickActive+'|'+entries.map(it=>it?items.key(it)+':'+save.inventory.filter(other=>items.key(other)===items.key(it)).length:'').join('|');
 if(signature===quickBarSignature)return;
 quickBarSignature=signature;
 bar.innerHTML=entries.map((it,i)=>{
  const count=it?.kind==='food'?save.inventory.filter(other=>items.key(other)===items.key(it)).length:0;
  return '<span class="quick-slot'+(i===save.quickActive?' active':'')+'" title="'+qEsc(it?itemTitle(it):'Leerer Schnellplatz')+'">'+
   (it?itemTile(it):'<span class="quick-empty">◇</span>')+'<b>'+(i+1)+'</b>'+(count>1?'<small>'+count+'</small>':'')+'</span>';
 }).join('');
}
function canQueueFood(){
 return items.foodNeeded(authorityMode&&authorityOwn?authorityOwn:player,maxHP(),save.consumeQueue,brewBonus.food)>0;
}
function queueConsumable(it,quick=false){
 if(authorityMode){serverItem('consume',it);return true;}
 const index=save.inventory.indexOf(it);
 if(index<0||(it.kind==='food'?!quick&&!canQueueFood():consumeMove?.it.kind==='potion'||save.consumeQueue.some(queued=>queued.kind==='potion')))return false;
 save.consumeQueue.push(save.inventory.splice(index,1)[0]);
 startConsumption();
 persist();
 return true;
}
function quickFood(){
 if(authorityMode){serverAction('quick-food');return;}
 const missing=items.foodNeeded(player,maxHP(),save.consumeQueue,brewBonus.food);
 const it=items.chooseFood(save.inventory,missing,brewBonus.food);
 if(it)queueConsumable(it,true);
 else tell('Du hast kein Essen dabei.');
}
function eatFood(it){
 return Boolean(items.food[it.id])&&queueConsumable(it);
}
function itemTile(it){
 return '<span class="item-glyph" style="--rarity:'+items.rarity[items.rank(it)].color+'">'+itemIcon(it)+'</span>';
}
function equipInventoryItem(it,targetSlot){
 if(authorityMode)return serverItem('equip',it,{slot:targetSlot});
 if(it.kind==='weapon'){
  if(unmetRequirements(it.id).length){soundUI('ui_error');tell('Attributvoraussetzungen fehlen');return;}
  clearHeldAttack();items.setWeapon(save.equipment,it);
 }else if(it.kind==='armor'){
  const piece=armorById(it.id);if(!piece)return;
  (save.equipment.armor??={})[piece.slot]=it.id;(save.equipment.armorRarities??={})[piece.slot]=items.rank(it);
 }else if(it.kind==='ring'){
  let slot=typeof targetSlot==='number'?targetSlot:save.equipment.rings.indexOf(it.id);
  if(slot<0)slot=save.equipment.rings.findIndex(r=>!r);
  if(slot<0){soundUI('ui_error');tell('Beide Ringplätze sind belegt · Lege zuerst einen Ring ab');return;}
  save.equipment.rings[slot]=it.id;(save.equipment.ringRarities??=[])[slot]=items.rank(it);
 }
 player.stamina=Math.min(player.stamina,maxStamina());soundUI('ui_confirm');persist();tell('Ausgerüstet · '+itemTitle(it));
}
const bagFilters={all:'Alle',...items.kinds,food:'Nahrung',potion:'Tränke',cup:'Becher',ingredient:'Zutaten'};
function itemComparison(it,label='Ausgewählt'){
 if(!it||!['weapon','armor','ring'].includes(it.kind))return itemDetails(it,label==='Angebot');
 const equipped=it.kind==='weapon'?[equippedWeapon()]:it.kind==='armor'?[equippedArmor(armorById(it.id)?.slot)]:
  [equippedRing(0),equippedRing(1)];
 const worn=equipped.filter(row=>row.id);
 return '<div class="item-comparison">'+
  '<section aria-label="'+label+'"><div class="comparison-title">'+label+'</div>'+itemDetails(it)+'</section>'+
  '<section aria-label="Ausgerüstet"><div class="comparison-title">Ausgerüstet</div>'+
  (worn.length?worn.map(row=>itemDetails(row)).join(''):'<p class="muted">Dieser Platz ist frei.</p>')+'</section></div>';

  '<button id="toGear">Ausrüstung</button><button id="closeInv">Schließen</button></div></section>'+
  '<aside class="rpg-right"><div id="rpgInspect"></div><button class="primary" id="md-equip-selected">Ausrüsten</button><button id="md-quick-selected">Zur Schnellauswahl</button><button id="md-drop-selected">Ablegen</button>'+
  (save.consumeQueue.length?'<small class="muted" role="status">Vorgemerkt zum Verzehr · '+save.consumeQueue.length+'</small>':'')+'</aside></div>','inventory');
 const inspect=it=>{
  $('#rpgInspect').innerHTML=itemComparison(it);
  const shortcut=$('#md-quick-selected');shortcut.disabled=!it||it.kind==='cup';

   drop.disabled=true;const index=save.inventory.indexOf(it);

   if(charm)useTrialCharm(it);else if(food)eatFood(it);else if(potion)usePotion(it);else equipInventoryItem(it,target?.slot);

async function removePack(id){
 if(id===DEFAULT_PACK||!packLibrary.has(id))return;
 const name=packTitle(id);
 if(!confirm('„'+name+'“ und den zugehörigen Dungeon-Fortschritt entfernen? Trophäen bleiben erhalten.'))return;
 try{
  if(packSync)await packSync;
  if(mdNavigatingToNewCharacter)return;
  if(accountId)await writeAccountPacks([{pack_id:id,data:null}]);
  if(id===save.activePack){
   const stored=save.runs.find(row=>row.packId===DEFAULT_PACK)?.state;
   writeAndReload({...save,...run.freshRun(run.freshSeed()),...stored,activePack:DEFAULT_PACK,
    packs:save.packs.filter(pack=>pack.packId!==id),runs:save.runs.filter(row=>row.packId!==id&&row.packId!==DEFAULT_PACK)},false,'Fragenpaket entfernt');
   return;
  }
  setPackList(save.packs.filter(pack=>pack.packId!==id));
  save.runs=save.runs.filter(row=>row.packId!==id);
  persist();packMenu('Fragenpaket entfernt · '+name);
 }catch(error){packMenu('Entfernen fehlgeschlagen · '+error.message);}
}
function archiveRuns(){

  ? {...run.freshRun(stored.dungeonSeed),...stored,templeDepth:stored.templeDepth??run.templeDepth(stored.dungeonSeed,Math.min(LAST_DEPTH,stored.floor+1)),variedRooms:stored.variedRooms??false,layoutRevision:stored.layoutRevision??1}
  : run.freshRun(run.freshSeed());

}

const coopFigureCache=new WeakMap();
function coopFigureSource(src){
 return typeof src==='string'&&(/^questions\/figures\/[a-z0-9][a-z0-9._-]*\.(?:png|jpe?g|webp)$/i.test(src)||
  src.length<=48000&&/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(src));
}
function coopQuizFigure(figure){
 if(!figure)return null;
 const details={alt:figure.alt?.slice(0,180),caption:figure.caption?.slice(0,220)};
 if(coopFigureSource(figure.src))return {...details,src:figure.src};
 if(!coopFigureCache.has(figure)){
  coopFigureCache.set(figure,null);
  const img=new Image();
  img.onload=()=>{
   const preview=document.createElement('canvas');
   for(const max of [560,400,275]){
    const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    preview.width=Math.max(1,Math.round(img.naturalWidth*scale));
    preview.height=Math.max(1,Math.round(img.naturalHeight*scale));
    preview.getContext('2d').drawImage(img,0,0,preview.width,preview.height);
    const src=preview.toDataURL('image/webp',.77);
    if(coopFigureSource(src)){coopFigureCache.set(figure,{...details,src});break;}
   }
  };
  img.src=figure.src;
 }
 return coopFigureCache.get(figure);
}

    player.attack=0;player.wallRecoil=sample.wallRecoil;player.recoilAngle=event.angle;
   }
   wallImpactFeedback(event);
  }else if(event.kind==='sound')soundWorld(event.cue,event,{cooldown:.12,...event.mix});
  else if(event.kind==='dash'&&event.seat!==coopRoom.seat)soundWorld('hero_dash',event,{priority:2});
  else if(event.kind==='hit'){
   const isMe=event.seat===coopRoom.seat;
   showDamage(event.x,event.y,event.value,event.type,isMe,event.critical);
   if(isMe)shake=9;
   burst(event.x,event.y,items.damage[event.type]?.color??'#e7c697',isMe?12:8);
   if(event.seat){
    const appearance=isMe?save.character:authorityMeta.appearance,armor=isMe?save.equipment.armor:authorityMeta.armor;
    heroHitAudio(event,event,appearance,armor);
   }else{
    const cue=event.value===0?'hit_immune':event.type==='physical'&&Number.isInteger(event.enemyType)?
     enemyRules.physicalImpactCue(event.enemyType,event.weapon):hitCue[event.type];
    if(cue)soundWorld(cue,event,{group:'combat-element',cooldown:.10,gain:event.critical?.56:.86});
    if(criticalCue[event.critical])soundWorld(criticalCue[event.critical],event,{group:'combat-critical',cooldown:.12,priority:3});
   }
  }else if(event.kind==='door'){
   save.doors[event.id]=event.hp;
   const door=world.doors.find(d=>d.id===event.id);
   doorFeedback(door??event,event.hp,event.angle);
  }else if(event.kind==='furniture'){
   save.furnitureDamage[event.id]=event.hp;breakImpact(event,event.hp,event.angle);
  }else if(event.kind==='travel'&&event.seat===coopRoom.seat){
   phaserGame?.scene.getScene('Dungeon')?.cameras.main.centerOn(event.x,event.y);
   tell(layerNames[world.layerAt(event.x,event.y)]);
  }else if(event.kind==='armor')showArmorProc(event.proc,event,event.seat===coopRoom.seat);
  else if(event.kind==='death'&&event.seat===coopRoom.seat){
   Object.assign(player,{x:sample.x,y:sample.y,dash:0});
   const recap=event.recap??items.deathReport(save.floor,world.layerAt(sample.x,sample.y),questions,save,save,event.cause);
   presentAuthorityDeath(recap,Boolean(event.recap));
  }else if(event.kind==='portal')soundWorld('floor_portal_spawn',event,{priority:3});
  else if(event.kind==='notice'){
   if(pending?.serverQuiz&&pending.coopReason==='trial')close();tell(event.message);
  }
 }
 if(save.deathRecap)presentAuthorityDeath(save.deathRecap);
 updateCoopAltars();writeCoopHud();
}
function authorityQuizDisplay(packet){
 if(!packet?.question)return;
 const q=packet.question;
 if(q.type==='multiple-choice')q.correctIndices=Array(q.count).fill(null);
 quiz(typeof packet.i==='number'?packet.i:0,'server',null,q);
 pending.serverQuiz=packet.quiz;pending.coopReason=packet.reason;
 if(packet.trial){
  const label=document.createElement('p'),deadline=performance.now()+packet.trial.seconds*1000;
  const update=()=>{label.textContent='Prüftruhe · '+packet.trial.correct+'/'+packet.trial.target+' richtig · '+Math.max(0,Math.ceil((deadline-performance.now())/1000))+' s';};
  update();$('#modal .study-card')?.prepend(label);
  const timer=setInterval(()=>{if(!label.isConnected||performance.now()>=deadline){clearInterval(timer);return;}update();},250);
 }
 $('#leave').onclick=()=>finishAuthorityQuiz(null,true);
}
async function startAuthorityQuiz(reason,index,vessel){
 const response=await serverAction('quiz',{reason,index,vessel});
 if(response?.question)authorityQuizDisplay(response);
}
async function answerAuthority(value){
 if(!pending?.serverQuiz||pending.answered)return;
 const current=pending;pending.answered=true;
 const response=await serverAction('answer',{quiz:current.serverQuiz,choice:value});
 if(pending!==current)return;
 if(!response){current.answered=false;return;}
 current.q.explanation=response.explanation;current.q.correctIndices=response.correctIndices;
 reviewAnswer(current.q,value,response.ok,response.notice,color=>finishAuthorityQuiz(color));
}
async function finishAuthorityQuiz(color,skip=false){
 if(!pending?.serverQuiz)return;
 const reason=pending.coopReason;
 const response=await serverAction('review',{quiz:pending.serverQuiz,color,skip});
 if(!response){close();return;}
 if(response.question){authorityQuizDisplay(response);return;}
 if(reason==='brew')breweryMenu();
 else if(reason==='study')imageCards();
 else close();
}
async function authorityInteract(selection){
 if(!selection){tell('Hier gibt es nichts zu untersuchen');return;}
 const {kind,i,orb}=selection;
 if(kind==='cat'){petCat();return;}
 if(kind==='glossary'){archiveMenu();return;}
 if(kind==='gate'){await startAuthorityQuiz(kind,gates[i]?.id);return;}
 if(kind==='access'){
  if(world.accessState(selection.site)==='blocked')tell('Dieser Weg ist dauerhaft versiegelt');
  else await startAuthorityQuiz(kind,i);
  return;
 }
 if(kind==='trial'){
  show('<h2>Versiegelte Prüftruhe</h2><p>Beantworte die Fragen in '+trialSeconds+' Sekunden richtig.</p><div class="actions"><button class="primary" id="server-trial">Prüfung beginnen</button><button id="server-trial-back">Schließen</button></div>','trial');
  mdButton('server-trial',()=>startAuthorityQuiz(kind,i));mdButton('server-trial-back',close);return;
 }
 if(kind==='shrine'||kind==='temple'){await startAuthorityQuiz(kind,i);return;}
 const reply=await serverAction('interact',{kind,index:kind==='soul'?orb?.id:i});
 if(!reply)return;
 if(kind==='merchant')merchantDialogue();
 else if(kind==='brewery')breweryMenu();
 else if(kind==='smith')smithMenu();
 else if(kind==='well')wellMenu();
 else if(kind==='map')dungeonMapMenu();
 else if(kind==='soul'&&reply.item)showPickedSoul(reply.item);
 else if(reply.victory)showCoopVictory();
}

function finishLoading(){
 if(mdNavigatingToNewCharacter)return;
 if(!coopRoom&&save.deathRecap){
  const recap=save.deathRecap;atTitle=false;deathPending=true;
  showDeathRecap(recap,()=>continueSoloDeath(save),'Weiter zu Tiefe '+save.floor);
 }else if(resume)resumeGame();else mdTitle();
 if(alley){
  const controls=$('#alley-help');
  controls.hidden=false;controls.style.display='block';
  const heavyHint=document.createElement('small');
  heavyHint.style.display='block';
  heavyHint.textContent='Leertaste halten und loslassen · schwerer Hieb';
  controls.after(heavyHint);
  const itemHint=document.createElement('small');
  itemHint.style.display='block';
  itemHint.textContent='Y Essen · Q Trank';
  heavyHint.after(itemHint);
  $('#dpad').style.display='none';
  if(matchMedia('(pointer:coarse)').matches||document.body.classList.contains('touch-force'))
   tell('Handy: Stick bewegen · ⚔ Angriff · ↷ Rolle · E Leiter/Treppe · Welt antippen zum Laufen');
 }
 if(generationMode)window.AlleyGeneratorUI?.mount({generator:window.AlleyGenerator,player:()=>player,iso});
 if(alley)tell(generationMode?'Generator-Test · 10 verbundene Räume · Seed '+window.AlleyGenerator.seed:
  guardian?'Etappe 4a · Hinter dem Torbogen führt der Weg zum Archiv und ins Behavioristen-Labor.':'Etappe 4a · Wächtergrafik konnte nicht geladen werden.');
 if(bossTest)tell('Boss-Test · Fallgitter im Laborflur links ist offen');
 if(coopRoom)connectCoop();
 const resumeMessage=sessionStorage.getItem(RESUME_KEY+'-message');
 if(resumeMessage){sessionStorage.removeItem(RESUME_KEY+'-message');tell(resumeMessage);}
}
const accountReady=testRun?Promise.resolve():mdInit().then(()=>syncAccountPacks()).catch(err=>console.warn('Fragenpakete offline:',err.message));
if(window.DungeonLoading)window.DungeonLoading.ready(finishLoading,Promise.allSettled([questionsReady,accountReady,guardianReady,skeletonReady]));else finishLoading();
accountReady.then(async()=>{
 if(testRun)return;
 const confirmation=await mdHandleEmailConfirmation();
 if(confirmation?.ok)mdAccount();else if(confirmation?.error)alert('E-Mail-Bestätigung: '+confirmation.error);
}).catch(err=>console.warn('Initialisierung:',err));window.addEventListener('beforeunload',persist);setInterval(()=>{const el=document.querySelector('#perf');if(el&&el.style.display!=='none')el.textContent=(phaserActive?'Phaser 3':'Canvas')+' · '+renderStats.fps+' FPS · '+enemies.length+' Gegner'},500);window.addEventListener('keydown',e=>{if(e.code==='F3'){e.preventDefault();const el=document.querySelector('#perf');el.style.display=el.style.display==='none'?'block':'none'}});window.__mindDiagnostics={get strataShader(){return Boolean(strataFx?.shader)},get engine(){return phaserActive?'Phaser 3':'Canvas-Ersatzrenderer'},get fps(){return renderStats.fps},get draws(){return renderStats.draws},get enemyCount(){return enemies.length},get questions(){return questions.length}};
})();

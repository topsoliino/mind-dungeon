function updateRestCat(dt){
 if(!restCat||!explored.has(rest.id))return;
 const {target,duration,age}=restCat;
 if(target){
  const stride=Math.min(1,dt/Math.max(dt,duration-age));
  restCat.x+=(target.x-restCat.x)*stride;restCat.y+=(target.y-restCat.y)*stride;
 }
 restCat.age+=dt;
 if(restCat.age<duration)return;
 const roll=Math.random();
 if(roll<.18&&restCat.mode!=='sleep')catMode('sleep',rand(4.8,8));
 else if(roll<.38)catMode('sit',rand(2,4));
 else if(!catMove(roll>.85))catMode('idle',1.1);
}

function furnitureBlocked(x,y,rx=12,ry=rx){
 return furniture.some(p=>{
  if(!p.solid)return false;
  const inset=reducedDepth.has(p.type)?Math.min(7,p.h*.24):0;
  return Math.abs(x-p.x)<p.w/2+rx&&Math.abs(y-p.y-inset)<p.h/2-inset+ry;
 });
}
function footWall(x,y){
 const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
 if(terrain[ty]?.[tx]!=='partition')return wall(x,y);
 const lineX=terrain[ty]?.[tx-1]==='partition'||terrain[ty]?.[tx+1]==='partition';
 const north=terrain[ty-1]?.[tx]==='partition',south=terrain[ty+1]?.[tx]==='partition';
 const ox=x-(tx+.5)*TILE,oy=y-(ty+.5)*TILE;
 if(lineX||!north&&!south){
  const left=terrain[ty]?.[tx-1]==='partition'?-24:-22,right=terrain[ty]?.[tx+1]==='partition'?24:22;
  if(ox>=left&&ox<=right&&oy>=-9&&oy<=5)return true;
 }
 return Math.abs(ox)<=9&&((north&&oy<=5)||(south&&oy>=-9));
}
function valid(x,y,r=12,ignoreSeals=false,feet=false){
 const rx=feet?10:r,ry=feet?5:r,solid=feet?footWall:wall;
 for(const dx of [-rx,0,rx])for(const dy of [-ry,0,ry]){
  if(solid(x+dx,y+dy)||!ignoreSeals&&gateBlocked(x+dx,y+dy))return false;
 }
 return !furnitureBlocked(x,y,feet?9:r,feet?6:r);
}

async function refreshCatalog(){

  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(cfg.url))throw Error('Supabase-URL ungültig');
  const response=await fetch(cfg.url+'/rest/v1/item_catalog?select=*&enabled=eq.true',{headers:{apikey:cfg.publishableKey},signal:AbortSignal.timeout(3500)});
  if(!response.ok)throw Error('Supabase-Katalog nicht bereit: '+response.status);
  const rows=await response.json();
  const weapons=rows.filter(x=>x.kind==='weapon').map(x=>({id:x.id,name:x.name_de,desc:x.description_de,base:x.base_damage,reach:x.reach,speed:Number(x.attack_seconds),stamina:x.stamina_cost,scale:x.scaling||{}}));
  const rings=rows.filter(x=>x.kind==='ring').map(x=>({id:x.id,name:x.name_de,desc:x.description_de,bonus:x.effect?.bonus}));
  if(!weapons.some(w=>w.id==='rust')||!rings.length)throw Error('Grundkatalog unvollständig');
  WEAPONS=weapons.some(w=>w.id==='bow')?weapons:[...weapons,simpleBow];RINGS=rings;window.__mindCatalogSource='Supabase';
 }catch(err){
  console.warn('Supabase noch nicht verfügbar, lade lokalen Katalog:',err.message);
  try{const response=await fetch('catalog/items.json',{cache:'no-cache'});if(!response.ok)throw Error('Lokaler Katalog nicht erreichbar');const catalog=await response.json();if(!Array.isArray(catalog.weapons)||!Array.isArray(catalog.rings)||!catalog.weapons.length)throw Error('Ungültiger Katalog');WEAPONS=catalog.weapons.some(w=>w.id==='bow')?catalog.weapons:[...catalog.weapons,simpleBow];RINGS=catalog.rings;window.__mindCatalogSource='catalog/items.json'}catch(e){console.warn('Ersatzkatalog aktiv:',e.message);window.__mindCatalogSource='eingebauter Ersatzkatalog'}
 }
}

   if(wall(shot.x,shot.y)||gateBlocked(shot.x,shot.y)){

function heroFrame(){
 if(consumeMove){
  const move=consumeMove,t=move.age/move.length;
  const stage=t<.16?0:t<.35?1:t<.79?2:3;
  return (move.it.kind==='food'?3:7)+stage;
 }
 if(vault)return player.back?backHeroIndex+2+Math.floor(vault.age/vault.duration*4):vault.age<vault.duration*.45?1:2;
 const stepping=player.moving&&player.attack<=0;
 if(player.back)return backHeroIndex+(stepping?1+Math.floor(player.walk)%6:0);
 return !stepping?0:Math.sin(player.walk)>.25?1:Math.sin(player.walk)<-.25?2:0;
}
function foeFrame(e){
 if(isBat(e)){
  const move=e.batMove,spec=enemyRules.attacks[e.type];
  if(!move)return Math.floor(e.phase*15)%4;
  const age=move.age-spec.windup;
  if(age<0)return 4+Math.min(3,Math.floor(move.age/spec.windup*4));
  return age<move.duration?8+Math.floor(age*19)%4:12+Math.min(3,Math.floor((age-move.duration)*16));
 }
 if(!isLion(e))return enemyRules.spriteFrame(e);
 const move=e.lionMove;if(!move)return Math.floor(e.phase*(e.moving?12:3))%4;
 if(move.age<move.windup)return 4+Math.min(3,Math.floor(4*move.age/move.windup));
 const t=(move.age-move.windup)/move.duration;
 if(move.kind==='rake'){
  const elapsed=move.age-move.windup;
  return 16+(move.last?Math.min(3,Math.floor((elapsed-move.last.time)*23)):0);
 }
 return (move.kind==='leap'?8:12)+Math.min(3,Math.floor(t*4));
}
function foeLift(e){
 if(isBat(e))return -14+Math.sin(e.phase*7)*4;
 const move=e.lionMove;
 if(move?.kind==='leap'&&move.age>=move.windup)return -Math.round(25*Math.sin(Math.PI*Math.min(1,(move.age-move.windup)/move.duration)));

let packSync=null;
async function syncAccountPacks(legacy=[]){
 if(!accountId||mdSession?.user?.id!==accountId)return;
 if(packSync)await packSync;
 const task=(async()=>{
  const rows=await mdRest('question_packs?select=pack_id,data&order=pack_id.asc');
  const known=new Set(rows.map(row=>row.pack_id));
  const missing=new Map();
  for(const pack of [...save.packs,...legacy]){
   try{
    const normalized=run.validatePack(pack);
    if(normalized.packId!==DEFAULT_PACK&&!known.has(normalized.packId))missing.set(normalized.packId,normalized);
   }catch{}
  }
  if(missing.size){
   await writeAccountPacks([...missing].map(([pack_id,data])=>({pack_id,data})),'ignore-duplicates');
   rows.splice(0,rows.length,...await mdRest('question_packs?select=pack_id,data&order=pack_id.asc'));
  }
  const packs=rows.flatMap(({pack_id,data})=>{
   if(!data||pack_id===DEFAULT_PACK)return [];
   try{return [run.validatePack(data)];}catch{return [];}
  });
  const removed=new Set(rows.filter(row=>!row.data).map(row=>row.pack_id));
  setPackList(packs);
  save.runs=save.runs.filter(row=>!removed.has(row.packId));
  if(effectivePackId(save.activePack)!==save.activePack){
   const stored=save.runs.find(row=>row.packId===DEFAULT_PACK)?.state;
   writeAndReload({...save,...run.freshRun(run.freshSeed()),...stored,activePack:DEFAULT_PACK},false);
  }else{
   if(save.activePack!==DEFAULT_PACK)usePack(packLibrary.get(save.activePack));

  }
 })();

async function mdHandleEmailConfirmation(){
 const hash=new URLSearchParams(location.hash.slice(1));
 if(hash.has('error')){const msg=hash.get('error_description')||hash.get('error');history.replaceState(null,'',location.pathname+location.search);return {error:msg}}
 const access_token=hash.get('access_token'),refresh_token=hash.get('refresh_token');
 if(!access_token||!refresh_token)return null;
 // Never retain session credentials in browser URL or history.
 history.replaceState(null,'',location.pathname+location.search);
 try{
  const r=await fetch(MD_PUBLIC_CONFIG.url+'/auth/v1/user',{headers:{apikey:MD_PUBLIC_CONFIG.publishableKey,Authorization:'Bearer '+access_token}});
  if(!r.ok)throw Error('Bestätigungslink konnte nicht geprüft werden');
  const user=await r.json();
  mdSetSession({access_token,refresh_token,expires_in:Number(hash.get('expires_in')||3600),user});
  return {ok:true};
 }catch(e){return {error:e.message}}
}

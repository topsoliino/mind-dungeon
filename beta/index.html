  if(!p.solid)return false;
  const inset=reducedDepth.has(p.type)?Math.min(7,p.h*.24):0;

 });
}

async function refreshCatalog(){
 try{
  const cfg=MD_PUBLIC_CONFIG;
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(cfg.url))throw Error('Supabase-URL ungültig');
  const response=await fetch(cfg.url+'/rest/v1/item_catalog?select=*&enabled=eq.true',{headers:{apikey:cfg.publishableKey},signal:AbortSignal.timeout(3500)});
  if(!response.ok)throw Error('Supabase-Katalog nicht bereit: '+response.status);
  const rows=await response.json();
  const weapons=rows.filter(x=>x.kind==='weapon').map(x=>({id:x.id,name:x.name_de,desc:x.description_de,base:x.base_damage,reach:x.reach,speed:Number(x.attack_seconds),stamina:x.stamina_cost,scale:x.scaling||{}}));
  const rings=rows.filter(x=>x.kind==='ring').map(x=>({id:x.id,name:x.name_de,desc:x.description_de,bonus:x.effect?.bonus}));
  if(!weapons.length||!rings.length)throw Error('Supabase-Katalog ist noch leer');
  WEAPONS=weapons;RINGS=rings;window.__mindCatalogSource='Supabase';
 }catch(err){
  console.warn('Supabase noch nicht verfügbar, lade lokalen Katalog:',err.message);
  try{const response=await fetch('catalog/items.json',{cache:'no-cache'});if(!response.ok)throw Error('Lokaler Katalog nicht erreichbar');const catalog=await response.json();if(!Array.isArray(catalog.weapons)||!Array.isArray(catalog.rings)||!catalog.weapons.length)throw Error('Ungültiger Katalog');WEAPONS=catalog.weapons;RINGS=catalog.rings;window.__mindCatalogSource='catalog/items.json'}catch(e){console.warn('Ersatzkatalog aktiv:',e.message);window.__mindCatalogSource='eingebauter Ersatzkatalog'}
 }
}

async function mdHandleEmailConfirmation(){

 // Never retain session credentials in browser URL or history.
 history.replaceState(null,'',location.pathname+location.search);
 try{
  const r=await fetch(MD_PUBLIC_CONFIG.url+'/auth/v1/user',{headers:{apikey:MD_PUBLIC_CONFIG.publishableKey,Authorization:'Bearer '+access_token}});
  if(!r.ok)throw Error('Bestätigungslink konnte nicht geprüft werden');
  const user=await r.json();
  mdSetSession({access_token,refresh_token,expires_in:Number(hash.get('expires_in')||3600),user});
  return {ok:true};
 }catch(e){return {error:e.message}}
}

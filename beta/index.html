}
function switchPack(packId,restart=false){
 if(packId===save.activePack&&!restart){if(save.completed)trophyMenu(true);else close();return;}
 persist();
 const archived=archiveRuns();
 const stored=archived.find(r=>r.packId===packId)?.state;
 const state=(!restart&&stored)||run.freshRun(run.freshSeed());
 writeAndReload({...save,...state,hp:maxHP(),activePack:packId,runs:archived.filter(r=>r.packId!==packId)},!state.completed);
}
function packMenu(status=''){
 const ids=[DEFAULT_PACK,...save.packs.map(p=>p.packId)];
 show('<h2 class="md-title">Fragenpakete</h2><p>Jeder Fragenpool besitzt einen eigenen Dungeon-Fortschritt. Dein Charakter und seine Ausrüstung reisen mit.</p>'
  +(status?'<p class="pill" role="status">'+qEsc(status)+'</p>':'')
  +ids.map((id,i)=>{
   const active=id===save.activePack;
   const state=active?save:save.runs.find(r=>r.packId===id)?.state;
   const label=state?.completed?'Abgeschlossen':state?'Tiefe '+state.floor+'/'+LAST_DEPTH:'Neuer Dungeon';
   return '<div class="md-slot"><div><b>'+qEsc(packTitle(id))+'</b><br><small>'+
    (active?'Aktiv · ':'')+label+'</small></div><button data-pack="'+i+'">'+(state?.completed?'Trophäe ansehen':state?'Fortsetzen':'Dungeon starten')+'</button></div>';
  }).join('')
  +'<div class="md-actions"><button class="primary" id="md-import-pack">JSON importieren</button><button id="md-back">Hauptmenü</button></div>','packs');
 document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>switchPack(ids[Number(b.dataset.pack)]));
 mdButton('md-import-pack',()=>$('#import').click());mdButton('md-back',mdTitle);

function trophyMenu(victory=false){

   '</span><div><b>'+qEsc(packLibrary.get(id)?.title||trophy?.title||packTitle(id))+'</b><br><small>'+

 }).join('');

  '<div class="md-actions">'+(victory?'<button id="md-restart">Diesen Dungeon neu starten</button>':'')+
  '<button id="md-back">Hauptmenü</button></div>','trophies');
 mdButton('md-back',mdTitle);
 mdButton('md-restart',()=>switchPack(save.activePack,true));
}
function mdTitle(){
const hero=save.character;show('<div class="md-theme"><div class="md-kicker">Ein Vermächtnis aus Schatten und Wissen</div><h1 class="md-title">MIND DUNGEON</h1><p class="md-subtitle">SHADOWBOUND</p><div class="md-hero"><div class="md-portrait" id="md-title-portrait"></div><div><b>'+mdEscape(hero?.name||'Unbenannter Wanderer')+'</b><p class="md-status">'+mdEscape(hero?.className||'Noch keine Klasse')+' · Stufe '+save.level+'<br>Spielzeit: '+mdDuration(save.playtime)+'</p></div></div><div class="md-actions"><button class="primary" id="md-continue">▶ Fortsetzen</button><button id="md-create">Neuer Charakter</button><button id="md-packs">Fragenpakete</button><button id="md-trophies">Trophäen</button><button id="md-saves">Spielstände</button><button id="md-login">Konto / Cloud</button></div><p class="md-status">WASD bewegen · Leertaste angreifen · I Inventar · C Ausrüstung · P Spielmenü</p></div>','title');

function mdCreator(){

show('<div class="md-kicker">Ein neues Vermächtnis</div><h2 class="md-title">Charakter erschaffen</h2><label class="md-field">Name<input id="md-name" maxlength="24" placeholder="Name deines Helden" value="Wanderer"></label><div class="md-layout"><div><label class="md-field">Gewandfarbe<input type="color" id="md-color" value="#7652a9"></label><label class="md-field">Hautfarbe<input type="color" id="md-skin" value="#d4a785"></label><label class="md-field">Haarfarbe<input type="color" id="md-hair" value="#392b4e"></label></div><div class="md-card"><div class="md-kicker">Vorschau</div><div id="md-preview" class="md-portrait" style="margin:10px auto"></div></div></div><h3>Startklasse</h3><div class="md-layout">'+classes.map((c,i)=>'<button class="md-card md-class '+(!i?'active':'')+'" data-md-class="'+i+'"><h3>'+iconImage('weapon',weaponArtId(c.weapon_id)).replace('<img ','<img class="class-glyph" ')+mdEscape(c.name_de)+'</h3><p>'+mdEscape(c.description_de)+'</p><small>'+mdEscape(weaponById(c.weapon_id).name)+' · '+mdEscape(ringById(c.starting_item_id)?.name||'Startgegenstand')+'</small></button>').join('')+'</div><div id="md-class-stats" class="md-card"></div><p class="md-warning">Ein neuer Charakter ersetzt den aktuellen lokalen Spielstand. Bestehende Cloud-Spielstände bleiben erhalten, bis du einen Slot überschreibst.</p><div class="md-actions"><button class="primary" id="md-begin">Charakter erstellen</button><button id="md-back">Zurück</button></div>','creator');
let selected=0;function drawClass(){const c=classes[selected];document.querySelectorAll('[data-md-class]').forEach((b,i)=>b.classList.toggle('active',i===selected));document.getElementById('md-class-stats').innerHTML='<b>'+mdEscape(c.name_de)+'</b><p class="md-status">'+Object.entries(c.attributes||{}).map(([k,v])=>mdEscape(ATTRS[k]?.[0]||k)+': '+v).join(' · ')+'</p>'}
document.querySelectorAll('[data-md-class]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.mdClass);drawClass();updatePreview()});drawClass();

 const c=classes[selected];
 mountPortrait($('#md-preview'),{
  color:$('#md-color').value,skin:$('#md-skin').value,hair:$('#md-hair').value
 },c.weapon_id);
}
for(const id of ['md-color','md-skin','md-hair'])document.getElementById(id).oninput=updatePreview;
updatePreview();
mdButton('md-back',mdTitle);mdButton('md-begin',()=>{const name=document.getElementById('md-name').value.trim();if(!name){alert('Bitte gib einen Namen ein.');return}if(!confirm('Neuen Charakter beginnen? Der aktuelle lokale Spielstand wird ersetzt.'))return;
const c=classes[selected],attrs=Object.fromEntries(Object.keys(ATTRS).map(k=>[k,10]));Object.assign(attrs,c.attributes||{});
const newSave={hp:70+(attrs.vigor||10)*3,x:5.5*TILE,y:6.5*TILE,xp:0,gold:0,kills:0,solved:{},packs:save.packs||[],opened:[],floor:1,gates:{},gateProgress:{},gateQuestions:{},level:1,attributes:attrs,inventory:[{kind:'weapon',id:c.weapon_id},...(c.starting_item_id?[{kind:'ring',id:c.starting_item_id}]:[])],equipment:{weapon:c.weapon_id,rings:[c.starting_item_id||null,null],armor:{}},pendingLevels:0,enemyTier:1,playtime:0,character:{name,classId:c.id,className:c.name_de,color:document.getElementById('md-color').value,skin:document.getElementById('md-skin').value,hair:document.getElementById('md-hair').value}};
writeAndReload({...newSave,...run.freshRun(run.freshSeed()),activePack:save.activePack,trophies:save.trophies},true)})}
function mdSaves(){
show('<div class="md-kicker">Chroniken der Wanderer</div><h2 class="md-title">Spielstände</h2><p class="md-status">Lokal wird immer der aktuelle Charakter gesichert. Cloud-Slots sind an dein Konto gebunden.</p><div class="md-slot"><div><b>Lokaler Spielstand</b><br><small>'+mdEscape(save.character?.name||'Wanderer')+' · '+mdDuration(save.playtime)+'</small></div><button id="md-local">Fortsetzen</button></div><div id="md-cloud-slots"><p>Cloud-Spielstände werden geladen …</p></div><div class="md-actions"><button id="md-account">Konto</button><button id="md-back">Zurück</button></div>','saves');
mdButton('md-local',close);mdButton('md-back',mdTitle);mdButton('md-account',mdAccount);
const el=document.getElementById('md-cloud-slots');if(!mdSession){el.innerHTML='<p class="md-warning">Für Cloud-Spielstände bitte anmelden.</p>';return}
(async()=>{try{const rows=await mdRest('character_saves?select=slot,data,updated_at&order=slot.asc');const by=new Map(rows.map(r=>[r.slot,r]));el.innerHTML=[1,2,3].map(slot=>{const r=by.get(slot),d=r?.data;return '<div class="md-slot"><div><b>Cloud-Slot '+slot+'</b><br><small>'+(d?mdEscape(d.character?.name||'Wanderer')+' · '+mdDuration(d.playtime):'Leer')+'</small></div><div class="md-row"><button data-save="'+slot+'">Speichern</button>'+(d?'<button data-load="'+slot+'">Laden</button>':'')+'</div></div>'}).join('');
el.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const slot=Number(b.dataset.save);if(!confirm('Lokalen Spielstand in Cloud-Slot '+slot+' speichern und vorhandenen Inhalt überschreiben?'))return;mdSlot=slot;localStorage.setItem('mind-beta-slot',String(slot));persist();try{await syncSave();mdSaves()}catch(err){alert('Cloud-Speichern fehlgeschlagen: '+err.message)}});
el.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const slot=Number(b.dataset.load),d=by.get(slot)?.data;if(!d)return;if(!confirm('Cloud-Spielstand laden? Der aktuelle lokale Spielstand wird ersetzt.'))return;mdSlot=slot;localStorage.setItem('mind-beta-slot',String(slot));const trophies=new Map([...(d.trophies||[]),...save.trophies].map(t=>[t.packId,t]));writeAndReload({...d,trophies:[...trophies.values()]},false)});
}catch(e){el.innerHTML='<p class="md-warning">'+mdEscape(e.message)+'</p>'}})()}
function mdAccount(){
show('<div class="md-kicker">Chroniken in der Wolke</div><h2 class="md-title">Spielerkonto</h2><div id="md-auth-box"></div><div class="md-actions"><button id="md-back">Zurück</button></div>','account');
mdButton('md-back',mdTitle);
const el=document.getElementById('md-auth-box');if(mdSession){el.innerHTML='<p>Angemeldet als <b>'+mdEscape(mdSession.user?.email||'Spieler')+'</b></p><div class="md-actions"><button id="md-cloud">Spielstände verwalten</button><button id="md-logout">Abmelden</button></div>';mdButton('md-cloud',mdSaves);mdButton('md-logout',async()=>{try{await fetch(mdConfig.url+'/auth/v1/logout',{method:'POST',headers:{apikey:mdConfig.publishableKey,Authorization:'Bearer '+mdSession.access_token}})}catch{}mdSession=null;localStorage.removeItem(MD_AUTH_KEY);mdAccount()});return}
el.innerHTML='<label class="md-field">E-Mail<input type="email" id="md-email" autocomplete="email"></label><label class="md-field">Passwort<input type="password" id="md-password" autocomplete="current-password" minlength="6"></label><p id="md-auth-error" class="md-warning"></p><div class="md-actions"><button class="primary" id="md-signin">Anmelden</button><button id="md-register">Registrieren</button></div><p class="md-status">Bei Registrierung kann eine Bestätigung per E-Mail erforderlich sein.</p>';
for(const [id,action] of [['md-signin','login'],['md-register','register']])mdButton(id,async()=>{const email=document.getElementById('md-email').value.trim(),password=document.getElementById('md-password').value;if(!email||!password){document.getElementById('md-auth-error').textContent='Bitte E-Mail und Passwort eingeben.';return}try{const ok=await mdAuth(action,email,password);if(ok)mdAccount();else document.getElementById('md-auth-error').textContent='Bitte bestätige die Registrierung über deine E-Mail.'}catch(e){document.getElementById('md-auth-error').textContent=e.message}})}

async function mdHandleEmailConfirmation(){
 const hash=new URLSearchParams(location.hash.slice(1));
 if(hash.has('error')){const msg=hash.get('error_description')||hash.get('error');history.replaceState(null,'',location.pathname+location.search);return {error:msg}}
 const access_token=hash.get('access_token'),refresh_token=hash.get('refresh_token');
 if(!access_token||!refresh_token)return null;
 // Never retain session credentials in browser URL or history.
 history.replaceState(null,'',location.pathname+location.search);
 try{
  const r=await fetch(MD_PUBLIC_CONFIG.url+'/auth/v1/user',{headers:{apikey:MD_PUBLIC_CONFIG.publishableKey,Authorization:'Bearer '+access_token}});
  if(!r.ok)throw Error('Bestätigungslink konnte nicht geprüft werden');
  const user=await r.json();
  mdSetSession({access_token,refresh_token,expires_in:Number(hash.get('expires_in')||3600),user});
  return {ok:true};
 }catch(e){return {error:e.message}}
}
const resume=sessionStorage.getItem(RESUME_KEY)==='1';
sessionStorage.removeItem(RESUME_KEY);
refreshCatalog();
loadQuestions();
if(resume)close();else mdTitle();
mdInit().then(async()=>{
 const confirmation=await mdHandleEmailConfirmation();
 if(confirmation?.ok)mdAccount();else if(confirmation?.error)alert('E-Mail-Bestätigung: '+confirmation.error);
}).catch(err=>console.warn('Initialisierung:',err));window.addEventListener('beforeunload',persist);setInterval(()=>{const el=document.querySelector('#perf');if(el&&el.style.display!=='none')el.textContent=(phaserActive?'Phaser 3':'Canvas')+' · '+renderStats.fps+' FPS · '+enemies.length+' Gegner'},500);window.addEventListener('keydown',e=>{if(e.code==='F3'){e.preventDefault();const el=document.querySelector('#perf');el.style.display=el.style.display==='none'?'block':'none'}});window.__mindDiagnostics={get engine(){return phaserActive?'Phaser 3':'Canvas-Ersatzrenderer'},get fps(){return renderStats.fps},get draws(){return renderStats.draws},get enemyCount(){return enemies.length},get questions(){return questions.length}};
})();

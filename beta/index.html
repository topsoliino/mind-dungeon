async function refreshCatalog(){
 try{
  const cfg=MD_PUBLIC_CONFIG;
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(cfg.url))throw Error('Supabase-URL ungültig');
  const response=await fetch(cfg.url+'/rest/v1/item_catalog?select=*&enabled=eq.true',{headers:{apikey:cfg.publishableKey},signal:AbortSignal.timeout(3500)});
  if(!response.ok)throw Error('Supabase-Katalog nicht bereit: '+response.status);
  const rows=await response.json();
  const weapons=rows.filter(x=>x.kind==='weapon').map(x=>({id:x.id,name:x.name_de,desc:x.description_de,base:x.base_damage,reach:x.reach,speed:Number(x.attack_seconds),stamina:x.stamina_cost,scale:x.scaling||{}}));
  const rings=rows.filter(x=>x.kind==='ring').map(x=>({id:x.id,name:x.name_de,desc:x.description_de,bonus:x.effect?.bonus}));
  if(!weapons.some(w=>w.id==='rust')||!rings.length)throw Error('Grundkatalog unvollständig');
  WEAPONS=weapons.some(w=>w.id==='bow')?weapons:[...weapons,simpleBow];RINGS=rings;window.__mindCatalogSource='Supabase';
 }catch(err){
  console.warn('Supabase noch nicht verfügbar, lade lokalen Katalog:',err.message);
  try{const response=await fetch('catalog/items.json',{cache:'no-cache'});if(!response.ok)throw Error('Lokaler Katalog nicht erreichbar');const catalog=await response.json();if(!Array.isArray(catalog.weapons)||!Array.isArray(catalog.rings)||!catalog.weapons.length)throw Error('Ungültiger Katalog');WEAPONS=catalog.weapons.some(w=>w.id==='bow')?catalog.weapons:[...catalog.weapons,simpleBow];RINGS=catalog.rings;window.__mindCatalogSource='catalog/items.json'}catch(e){console.warn('Ersatzkatalog aktiv:',e.message);window.__mindCatalogSource='eingebauter Ersatzkatalog'}
 }
}

  const rows=await mdRest('question_packs?select=pack_id,data&order=pack_id.asc');
  const known=new Set(rows.map(row=>row.pack_id));
  const missing=new Map();
  for(const pack of [...save.packs,...legacy]){
   try{
    const normalized=run.validatePack(pack);
    if(normalized.packId!==DEFAULT_PACK&&!known.has(normalized.packId))missing.set(normalized.packId,normalized);
   }catch{}
  }
  if(missing.size){
   await writeAccountPacks([...missing].map(([pack_id,data])=>({pack_id,data})),'ignore-duplicates');
   rows.splice(0,rows.length,...await mdRest('question_packs?select=pack_id,data&order=pack_id.asc'));
  }
  const packs=rows.flatMap(({pack_id,data})=>{
   if(!data||pack_id===DEFAULT_PACK)return [];
   try{return [run.validatePack(data)];}catch{return [];}
  });
  const removed=new Set(rows.filter(row=>!row.data).map(row=>row.pack_id));
  setPackList(packs);
  save.runs=save.runs.filter(row=>!removed.has(row.packId));
  if(effectivePackId(save.activePack)!==save.activePack){
   const stored=save.runs.find(row=>row.packId===DEFAULT_PACK)?.state;
   writeAndReload({...save,...run.freshRun(run.freshSeed()),...stored,activePack:DEFAULT_PACK},false);
  }else{
   if(save.activePack!==DEFAULT_PACK)usePack(packLibrary.get(save.activePack));
   persist();
  }
 })();
 packSync=task;
 try{await task;}finally{if(packSync===task)packSync=null;}
}
async function removePack(id){

 const name=packTitle(id);
 if(!confirm('„'+name+'“ und den zugehörigen Dungeon-Fortschritt entfernen? Trophäen bleiben erhalten.'))return;
 try{
  if(packSync)await packSync;
  if(mdNavigatingToNewCharacter)return;
  if(accountId)await writeAccountPacks([{pack_id:id,data:null}]);
  if(id===save.activePack){
   const stored=save.runs.find(row=>row.packId===DEFAULT_PACK)?.state;
   writeAndReload({...save,...run.freshRun(run.freshSeed()),...stored,activePack:DEFAULT_PACK,
    packs:save.packs.filter(pack=>pack.packId!==id),runs:save.runs.filter(row=>row.packId!==id&&row.packId!==DEFAULT_PACK)},false,'Fragenpaket entfernt');
   return;
  }
  setPackList(save.packs.filter(pack=>pack.packId!==id));
  save.runs=save.runs.filter(row=>row.packId!==id);
  persist();packMenu('Fragenpaket entfernt · '+name);
 }catch(error){packMenu('Entfernen fehlgeschlagen · '+error.message);}
}

const coopFigureCache=new WeakMap();
function coopFigureSource(src){
 return typeof src==='string'&&(/^questions\/figures\/[a-z0-9][a-z0-9._-]*\.(?:png|jpe?g|webp)$/i.test(src)||
  src.length<=48000&&/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(src));
}
function coopQuizFigure(figure){
 if(!figure)return null;
 const details={alt:figure.alt?.slice(0,180),caption:figure.caption?.slice(0,220)};
 if(coopFigureSource(figure.src))return {...details,src:figure.src};
 if(!coopFigureCache.has(figure)){
  coopFigureCache.set(figure,null);
  const img=new Image();
  img.onload=()=>{
   const preview=document.createElement('canvas');
   for(const max of [560,400,275]){
    const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    preview.width=Math.max(1,Math.round(img.naturalWidth*scale));
    preview.height=Math.max(1,Math.round(img.naturalHeight*scale));
    preview.getContext('2d').drawImage(img,0,0,preview.width,preview.height);
    const src=preview.toDataURL('image/webp',.77);
    if(coopFigureSource(src)){coopFigureCache.set(figure,{...details,src});break;}
   }
  };
  img.src=figure.src;
 }
 return coopFigureCache.get(figure);
}
